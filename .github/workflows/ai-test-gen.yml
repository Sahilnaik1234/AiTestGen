name: AI DevSecOps Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:
    inputs:
      secret_tool:
        description: 'Secret Tool'
        default: 'gitleaks'
        type: string
      sast_tool:
        description: 'SAST Tool'
        default: 'semgrep'
        type: string

permissions:
  contents: write
  pull-requests: write
  security-events: write

jobs:
  # ============================================================
  # SECURITY SCANNING STAGE
  # ============================================================
  security-scans:
    name: "🛡️ Security Scanning"
    runs-on: ubuntu-latest
    env:
      SCAN_INCLUDE: 'src'
      SCAN_EXCLUDE: 'node_modules,tests,docs'
    steps:
      - uses: actions/checkout@v4

      - name: Run Secret Scan
        env:
          TOOL: ${{ github.event.inputs.secret_tool || 'gitleaks' }}
        run: |
          chmod +x tools/secrets/$TOOL.sh
          ./tools/secrets/$TOOL.sh || true

      - name: Run SAST Scan
        env:
          TOOL: ${{ github.event.inputs.sast_tool || 'semgrep' }}
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          chmod +x tools/sast/$TOOL.sh
          ./tools/sast/$TOOL.sh || true

      - name: Claude Code Security Audit
        if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install anthropic
          chmod +x tools/sast/claude.sh
          ./tools/sast/claude.sh || true

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            gitleaks-report.json
            semgrep-report.json
            claude-report.json

  # ============================================================
  # NORMALIZE & UNIFY SECURITY DATA
  # ============================================================
  security-normalize:
    name: "📊 Normalize Security Findings"
    runs-on: ubuntu-latest
    needs: [security-scans]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download Reports
        uses: actions/download-artifact@v4
        with:
          name: security-reports
          path: .
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unify Security Reports
        run: python scripts/normalize.py

      - name: Upload Unified Report
        uses: actions/upload-artifact@v4
        with:
          name: final-security-report
          path: final-security-report.json

  # ============================================================
  # AI TEST GENERATION STAGE
  # ============================================================
  generate-tests:
    name: "🧪 AI Test Generation"
    runs-on: ubuntu-latest
    needs: [security-normalize]
    env:
      INCLUDE_PATTERN: "services"
      EXCLUDE_PATTERN: ""
      COVERAGE_THRESHOLD: "75"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Detect Languages
        id: detect
        run: |
          DETECT_JSON=$(npx ts-node src/index.ts detect --json)
          LANGS=$(echo "$DETECT_JSON" | node -e "
            const data = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            const names = data.languages.map(l => l.name);
            console.log('languages=' + names.join(','));
            console.log('has_typescript=' + names.includes('typescript'));
            console.log('has_javascript=' + (names.includes('javascript') || names.includes('typescript')));
            console.log('has_go=' + names.includes('go'));
            console.log('has_python=' + names.includes('python'));
            console.log('has_java=' + names.includes('java'));
          ")
          echo "$LANGS" >> $GITHUB_OUTPUT

      - name: Run Coverage
        run: |
          rm -rf coverage/
          npm test || true

      - name: Generate AI Tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          npm start -- coverage \
            --threshold ${{ env.COVERAGE_THRESHOLD }} \
            --model groq \
            --include "${{ env.INCLUDE_PATTERN }}" \
            --exclude "${{ env.EXCLUDE_PATTERN }}"

      - name: Auto-Commit Generated Tests
        uses: stefanzweifel/git-auto-commit-action@v5
        if: always()
        with:
          commit_message: "🤖 chore: auto-generate missing tests based on coverage"

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            results.json
            coverage/

  # ============================================================
  # DASHBOARD DEPLOYMENT
  # ============================================================
  deploy-dashboard:
    name: "🚀 Deploy DevSecOps Dashboard"
    runs-on: ubuntu-latest
    needs: [generate-tests, security-normalize]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download Test Artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: dashboard/public/

      - name: Download Security Artifacts
        uses: actions/download-artifact@v4
        with:
          name: final-security-report
          path: dashboard/public/

      - name: Build Dashboard
        run: |
          cd dashboard
          npm install
          npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dashboard/dist
          branch: gh-pages
 