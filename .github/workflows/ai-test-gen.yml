name: AI Test Generation CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  generate-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install dependencies
      run: |
        npm install
        pip install pytest pytest-cov

    - name: Generate AI Tests
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        npm start -- generate "examples/**/*.*" --model groq

    - name: Run TypeScript/JS Coverage Check (Min 80%)
      run: npm test

    - name: Run Go Coverage Check (Min 80%)
      run: |
        cd examples
        go test -coverprofile=coverage.out ./...
        COVERAGE=$(go tool cover -func=coverage.out | grep total | grep -Eo '[0-9]+\.[0-9]+')
        echo "Total Go Coverage: $COVERAGE%"
        if (( $(echo "$COVERAGE < 70.0" | bc -l) )); then
          echo "❌ Go coverage below 70%"
          exit 1
        fi

    - name: Run Python Coverage Check (Min 70%)
      run: |
        pytest examples/ --cov=examples/ --cov-fail-under=70

    - name: Run Java Coverage Check (Min 70%)
      run: |
        cd examples
        cat <<EOF > pom.xml
        <project xmlns="http://maven.apache.org/POM/4.0.0">
          <modelVersion>4.0.0</modelVersion>
          <groupId>com.example</groupId>
          <artifactId>examples</artifactId>
          <version>1.0-SNAPSHOT</version>
          <properties>
            <maven.compiler.source>17</maven.compiler.source>
            <maven.compiler.target>17</maven.compiler.target>
            <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
          </properties>
          <dependencies>
            <dependency>
              <groupId>junit</groupId>
              <artifactId>junit</artifactId>
              <version>4.13.2</version>
              <scope>test</scope>
            </dependency>
          </dependencies>
          <build>
            <sourceDirectory>.</sourceDirectory>
            <testSourceDirectory>.</testSourceDirectory>
            <plugins>
              <plugin>
                <groupId>org.apache.maven.plugins</groupId>
                <artifactId>maven-surefire-plugin</artifactId>
                <version>3.2.5</version>
                <configuration>
                  <includes>
                    <include>**/*Test.java</include>
                  </includes>
                </configuration>
              </plugin>
              <plugin>
                <groupId>org.jacoco</groupId>
                <artifactId>jacoco-maven-plugin</artifactId>
                <version>0.8.11</version>
                <executions>
                  <execution>
                    <id>prepare-agent</id>
                    <goals><goal>prepare-agent</goal></goals>
                  </execution>
                  <execution>
                    <id>check</id>
                    <phase>test</phase>
                    <goals><goal>check</goal></goals>
                    <configuration>
                      <rules>
                        <rule>
                          <element>BUNDLE</element>
                          <limits>
                            <limit>
                              <counter>LINE</counter>
                              <value>COVEREDRATIO</value>
                              <minimum>0.70</minimum>
                            </limit>
                          </limits>
                        </rule>
                      </rules>
                    </configuration>
                  </execution>
                </executions>
              </plugin>
            </plugins>
          </build>
        </project>
        EOF
        mvn clean test jacoco:report jacoco:check

    - name: Upload Coverage Results
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports
        path: |
          coverage/
          examples/coverage.out

    - name: Built Dashboard
      run: |
        cd dashboard
        npm install
        npm run build

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: dashboard/dist
        branch: gh-pages
