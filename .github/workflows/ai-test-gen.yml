name: AI Test Generation CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-tests:
    runs-on: ubuntu-latest
    env:
      INCLUDE_PATTERN: "services,sourcess,examples"  # Add folder/file substring here to ONLY check those (e.g. "src")
      EXCLUDE_PATTERN: ""  # Add folder/file substring here to IGNORE (e.g. "legacy")

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install dependencies
      run: |
        npm install
        pip install pytest pytest-cov

    - name: Run TypeScript/JS Coverage Check
      run: npm test || true # Don't fail here, we want to generate tests if it's low

    - name: Run Go Coverage Check
      run: |
        go test -coverprofile=coverage.out ./... || true

    - name: Run Python Coverage Check
      run: |
        pytest . --cov=. --cov-report=json:coverage.json || true

    - name: Run Java Coverage Check
      run: |
        # Generate a pom.xml at the root that includes all source folders
        cat <<EOF > pom.xml
        <?xml version="1.0" encoding="UTF-8"?>
        <project xmlns="http://maven.apache.org/POM/4.0.0" 
                 xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                 xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
          <modelVersion>4.0.0</modelVersion>
          <groupId>com.example</groupId>
          <artifactId>ai-test-gen-all</artifactId>
          <version>1.0-SNAPSHOT</version>
          <properties>
            <maven.compiler.source>17</maven.compiler.source>
            <maven.compiler.target>17</maven.compiler.target>
            <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
          </properties>
          <dependencies>
            <dependency>
              <groupId>org.junit.jupiter</groupId>
              <artifactId>junit-jupiter</artifactId>
              <version>5.10.1</version>
            </dependency>
          </dependencies>
          <build>
            <sourceDirectory>.</sourceDirectory>
            <testSourceDirectory>.</testSourceDirectory>
            <plugins>
              <plugin>
                <groupId>org.apache.maven.plugins</groupId>
                <artifactId>maven-surefire-plugin</artifactId>
                <version>3.2.5</version>
                <configuration>
                  <includes>
                    <include>**/*Test.java</include>
                  </includes>
                </configuration>
              </plugin>
              <plugin>
                <groupId>org.jacoco</groupId>
                <artifactId>jacoco-maven-plugin</artifactId>
                <version>0.8.11</version>
                <executions>
                  <execution>
                    <id>prepare-agent</id>
                    <goals><goal>prepare-agent</goal></goals>
                  </execution>
                  <execution>
                    <id>report</id>
                    <phase>test</phase>
                    <goals><goal>report</goal></goals>
                  </execution>
                </executions>
              </plugin>
            </plugins>
          </build>
        </project>
        EOF
        mvn clean test || true

    - name: Generate AI Tests from Coverage
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        npm start -- coverage --threshold 75 --model groq --include "${{ env.INCLUDE_PATTERN }}" --exclude "${{ env.EXCLUDE_PATTERN }}"


    - name: Rerun Tests for Final Coverage
      if: always()
      run: |
        echo "🔄 Deep cleaning old reports and rerunning tests..."
        rm -rf coverage/
        rm -f coverage.json examples/coverage.out
        npm test || true
        go test -coverprofile=coverage.out ./... || true
        pytest . --cov=. --cov-report=json:coverage.json -v || true
        mvn clean test || true

    - name: Commit and Push AI Tests to Current Branch
      if: always()
      run: |
        git config --global user.name "AI Test Generator"
        git config --global user.email "ai-test-gen@github.com"
        
        # ONLY stage the generated test files
        git add **/*.test.ts **/*.test.js **/*_test.py **/*_test.go **/*Test.java
        
        if git diff --cached --quiet; then
          echo "✅ No new test cases generated."
        else
          echo "✨ New tests generated. Committing..."
          git commit -m "chore: add AI-generated test cases"
          
          # DISCARD all other unstaged changes (coverage reports, pom.xml, etc.) 
          # to allow rebase/pull to work
          git checkout -- .
          git clean -fd
          
          # Determine the actual branch name
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            TARGET_BRANCH="${{ github.head_ref }}"
          else
            TARGET_BRANCH="${{ github.ref_name }}"
          fi

          echo "🎯 Target branch is: $TARGET_BRANCH"

          # Rebase to latest to avoid conflicts
          git pull --rebase origin "$TARGET_BRANCH"
          
          # Push to the head branch
          git push origin "HEAD:$TARGET_BRANCH"
        fi

    - name: Create Pull Request to Dev
      if: always() && github.event_name != 'pull_request' && github.ref_name != 'dev' && github.ref_name != 'main'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Check if PR already exists
        PR_EXISTS=$(gh pr list --base dev --head ${{ github.ref_name }} --json number --jq '.[0].number')
        
        if [ -z "$PR_EXISTS" ]; then
          echo "🚀 Creating Pull Request to dev..."
          gh pr create --base dev --head ${{ github.ref_name }} \
            --title "🤖 AI Generated Tests - ${{ github.ref_name }}" \
            --body "This PR was automatically created to merge AI-generated tests from ${{ github.ref_name }} into dev."
        else
          echo "ℹ️ Pull Request already exists: #$PR_EXISTS"
        fi

    - name: Upload Coverage Results
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports
        path: |
          coverage/
          examples/coverage.out
          coverage.json
          examples/target/site/jacoco/jacoco.xml

    - name: Debug Deployment Info
      run: |
        echo "Current Ref: ${{ github.ref }}"
        echo "Event Name: ${{ github.event_name }}"

    - name: Build Dashboard
      run: |
        cd dashboard
        npm install
        npm run build --emptyOutDir || npm run build

    - name: Deploy to GitHub Pages
      if: contains(github.ref, 'main') || contains(github.ref, 'dev')
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: dashboard/dist
        branch: gh-pages
