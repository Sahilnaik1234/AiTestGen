name: AI Test Generation CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-tests:
    runs-on: ubuntu-latest
    env:
      INCLUDE_PATTERN: "services"  # Add folder/file substring here to ONLY check those (e.g. "src")
      EXCLUDE_PATTERN: ""  # Add folder/file substring here to IGNORE (e.g. "legacy")
      COVERAGE_THRESHOLD: "75"

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref || github.ref_name }}

    # ── Node.js is always needed (the tool itself is TypeScript) ──
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install tool dependencies
      run: npm install

    # ── Dynamic Language Detection ──
    - name: Detect languages in workspace
      id: detect
      run: |
        # Run the detect command and capture JSON
        DETECT_JSON=$(npx ts-node src/index.ts detect --json)
        echo "$DETECT_JSON"

        # Parse language names into individual flags
        LANGS=$(echo "$DETECT_JSON" | node -e "
          const data = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
          const names = data.languages.map(l => l.name);
          console.log('languages=' + names.join(','));
          console.log('has_typescript=' + names.includes('typescript'));
          console.log('has_javascript=' + (names.includes('javascript') || names.includes('typescript')));
          console.log('has_go=' + names.includes('go'));
          console.log('has_python=' + names.includes('python'));
          console.log('has_java=' + names.includes('java'));
          console.log('has_rust=' + names.includes('rust'));
          console.log('has_csharp=' + names.includes('csharp'));

          // Extract versions from detection
          for (const l of data.languages) {
            const key = l.name.replace(/[^a-z]/g, '');
            if (l.setupVersion) console.log(key + '_version=' + l.setupVersion);
          }
        ")
        echo "$LANGS" >> $GITHUB_OUTPUT

        # Log what was detected
        echo "🔍 Detected languages:"
        echo "$LANGS"

    # ── Conditional Runtime Setup (only install what's needed) ──
    - name: Set up Go
      if: steps.detect.outputs.has_go == 'true'
      uses: actions/setup-go@v5
      with:
        go-version: ${{ steps.detect.outputs.go_version || '1.21' }}

    - name: Set up Python
      if: steps.detect.outputs.has_python == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ steps.detect.outputs.python_version || '3.10' }}

    - name: Set up Java
      if: steps.detect.outputs.has_java == 'true'
      uses: actions/setup-java@v4
      with:
        java-version: ${{ steps.detect.outputs.java_version || '17' }}
        distribution: 'temurin'

    # ── Conditional Dependency Installation ──
    - name: Install Python test dependencies
      if: steps.detect.outputs.has_python == 'true'
      run: |
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi
        pip install pytest pytest-cov

    # ── Conditional Coverage Collection ──
    - name: Run TypeScript/JS Coverage
      if: steps.detect.outputs.has_typescript == 'true' || steps.detect.outputs.has_javascript == 'true'
      run: |
        rm -rf coverage/
        npm test || true

    - name: Run Go Coverage
      if: steps.detect.outputs.has_go == 'true'
      run: |
        go test -coverprofile=coverage.out ./... || true

    - name: Run Python Coverage
      if: steps.detect.outputs.has_python == 'true'
      run: |
        pytest . --cov=. --cov-report=json:coverage.json || true

    - name: Run Java Coverage
      if: steps.detect.outputs.has_java == 'true'
      run: |
        mvn clean test || true

    # ── AI Test Generation ──
    - name: Generate AI Tests from Coverage
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        npm start -- coverage \
          --threshold ${{ env.COVERAGE_THRESHOLD }} \
          --model groq \
          --include "${{ env.INCLUDE_PATTERN }}" \
          --exclude "${{ env.EXCLUDE_PATTERN }}"

    - name: Auto-Commit AI Tests to Feature Branch
      uses: stefanzweifel/git-auto-commit-action@v5
      if: always()
      with:
        commit_message: "🤖 chore: auto-generate missing tests based on coverage"

    # ── Final Validation (rerun only detected languages) ──
    - name: Rerun Tests for Final Coverage
      if: always()
      run: |
        echo "🔄 Rerunning tests for detected languages..."
        rm -rf coverage/
        rm -f coverage.json coverage.out

        DETECTED="${{ steps.detect.outputs.languages }}"

        if echo "$DETECTED" | grep -q "typescript\|javascript"; then
          echo "▶ Running JS/TS tests..."
          npm test || true
        fi

        if echo "$DETECTED" | grep -q "go"; then
          echo "▶ Running Go tests..."
          go test -coverprofile=coverage.out ./... || true
        fi

        if echo "$DETECTED" | grep -q "python"; then
          echo "▶ Running Python tests..."
          pytest . --cov=. --cov-report=json:coverage.json -v || true
        fi

        if echo "$DETECTED" | grep -q "java"; then
          echo "▶ Running Java tests..."
          mvn clean test || true
        fi

    - name: Final Coverage Check
      run: |
        echo "🎯 Final validation against ${{ env.COVERAGE_THRESHOLD }}% threshold..."
        npm start -- coverage \
          --threshold ${{ env.COVERAGE_THRESHOLD }} \
          --exit \
          --check-only \
          --include "${{ env.INCLUDE_PATTERN }}" \
          --exclude "${{ env.EXCLUDE_PATTERN }}"

    - name: Upload Coverage Results
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports
        path: |
          coverage/
          examples/coverage.out
          coverage.json
          examples/target/site/jacoco/jacoco.xml

    - name: Debug Deployment Info
      run: |
        echo "Current Ref: ${{ github.ref }}"
        echo "Event Name: ${{ github.event_name }}"

    - name: Build Dashboard
      run: |
        cd dashboard
        npm install
        npm run build --emptyOutDir || npm run build

    - name: Deploy to GitHub Pages
      if: always()
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: dashboard/dist
        branch: gh-pages
 