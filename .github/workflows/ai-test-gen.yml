name: AI DevSecOps Pipeline

on:
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:
    inputs:
      secret_tool:
        description: 'Secret Tool'
        default: 'gitleaks'
        type: string
      sast_tool:
        description: 'SAST Tool'
        default: 'semgrep'
        type: string

permissions:
  contents: write
  pull-requests: write
  security-events: write

jobs:
  # ============================================================
  # SECURITY SCANNING STAGE
  # ============================================================
  security-scans:
    name: "Security Scanning"
    runs-on: ubuntu-latest
    env:
      SCAN_INCLUDE: 'src'
      SCAN_EXCLUDE: 'node_modules,tests,docs'
    steps:
      - uses: actions/checkout@v4

      - name: Run Secret Scan
        env:
          TOOL: ${{ github.event.inputs.secret_tool || 'gitleaks' }}
        run: |
          mkdir -p reports
          if [ "$TOOL" == "gitleaks" ]; then
            docker run --rm -v "$(pwd):/src" zricethezav/gitleaks:latest detect --no-git --source="/src" --report-format=json --report-path=/src/reports/gitleaks-report.json --verbose || true
          elif [ "$TOOL" == "trufflehog" ]; then
            > trufflehog-report.json
            IFS=',' read -ra INCS <<< "$SCAN_INCLUDE"
            for i in "${INCS[@]}"; do
              i=$(echo "$i" | xargs)
              if [ -n "$i" ]; then
                docker run --rm -v "$(pwd):/src" trufflesecurity/trufflehog:latest filesystem "/src/$i" --json >> trufflehog-report.json || true
              fi
            done
          fi

      - name: Run SAST Scan
        env:
          TOOL: ${{ github.event.inputs.sast_tool || 'semgrep' }}
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          mkdir -p reports
          if [ "$TOOL" == "semgrep" ]; then
            TARGET_PATHS=""
            IFS=',' read -ra INCS <<< "$SCAN_INCLUDE"
            for i in "${INCS[@]}"; do
              i=$(echo "$i" | xargs)
              if [ -n "$i" ]; then TARGET_PATHS="$TARGET_PATHS /src/$i"; fi
            done
            TARGET_PATH="${TARGET_PATHS:-/src}"
            docker run --rm -v "$(pwd):/src" -e SEMGREP_APP_TOKEN=$SEMGREP_APP_TOKEN semgrep/semgrep semgrep --config=auto --json --output=/src/reports/semgrep-report.json --exclude="*report.json" --exclude="reports/" --exclude="node_modules" --no-git-ignore $TARGET_PATH || true
          elif [ "$TOOL" == "claude" ]; then
            pip install anthropic
            python3 tools/sast/claude_analyzer.py || true
          fi

      - name: Run Dependency Scan
        run: |
          EXC_FLAGS=""
          if [ -n "$SCAN_EXCLUDE" ]; then EXC_FLAGS="--skip-dirs ${SCAN_EXCLUDE}"; fi
          docker run --rm -v "$(pwd):/src" aquasec/trivy:latest fs --format json --output /src/dependency-report.json $EXC_FLAGS "/src/${SCAN_INCLUDE:-.}" || true

      - name: Run SOC2 Compliance
        run: |
          mkdir -p reports
          docker run --rm -v "$(pwd):/src" semgrep/semgrep semgrep \
            --config=/src/tools/configs/.semgrep-soc2.yml \
            --config=p/secrets \
            --exclude="*report.json" \
            --exclude="reports/" \
            --exclude="node_modules" \
            --json --output=/src/reports/soc2-report.json /src || true

      - name: Run HIPAA Compliance
        run: |
          docker run --rm -v "$(pwd):/src" semgrep/semgrep semgrep \
            --config=/src/tools/configs/.semgrep-hipaa.yml \
            --json --output=/src/hipaa-report.json /src || true

      - name: Claude Code Security Audit
        if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install anthropic
          python3 tools/sast/claude_analyzer.py || true

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            reports/*.json
            dependency-report.json
            claude-report.json

  # ============================================================
  # NORMALIZE & UNIFY SECURITY DATA
  # ============================================================
  security-normalize:
    name: "📊 Normalize Security Findings"
    runs-on: ubuntu-latest
    needs: [security-scans]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download Reports
        uses: actions/download-artifact@v4
        with:
          name: security-reports
          path: .
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unify Security Reports
        run: python scripts/normalize.py

      - name: AI Risk Audit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install anthropic
          python3 tools/sast/risk_auditor.py || true

      - name: Upload Unified Report
        uses: actions/upload-artifact@v4
        with:
          name: final-security-report
          path: final-security-report.json

  # ============================================================
  # AI TEST GENERATION STAGE
  # ============================================================
  generate-tests:
    name: " AI Test Generation"
    runs-on: ubuntu-latest
    needs: [security-normalize]
    env:
      INCLUDE_PATTERN: "services"
      EXCLUDE_PATTERN: ""
      COVERAGE_THRESHOLD: "75"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      # ══════════════════════════════════════════════════════════════
      # DYNAMIC DETECTION: Config File → Language → Framework → Cmds
      # ══════════════════════════════════════════════════════════════
      - name: Detect languages from config files
        id: detect
        run: |
          DETECT_JSON=$(npx ts-node src/index.ts detect --json)
          echo "$DETECT_JSON"

          # Parse into GitHub Actions outputs using new interface
          echo "$DETECT_JSON" | node -e "
            const data = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            const langs = data.languages;
            const names = langs.map(l => l.language);
            const lines = [];

            lines.push('languages=' + names.join(','));
            lines.push('has_node=' + (names.includes('typescript') || names.includes('javascript')));
            lines.push('has_go=' + names.includes('go'));
            lines.push('has_python=' + names.includes('python'));
            lines.push('has_java=' + (names.includes('java') || names.includes('kotlin')));
            lines.push('has_rust=' + names.includes('rust'));
            lines.push('has_csharp=' + names.includes('csharp'));
            lines.push('has_ruby=' + names.includes('ruby'));

            // Per-language details (version, test cmd, install cmd, framework)
            for (const l of langs) {
              const key = l.language.replace(/[^a-z]/g, '');
              if (l.setupVersion) lines.push(key + '_version=' + l.setupVersion);
              if (l.testCommand) lines.push(key + '_test_cmd=' + l.testCommand);
              if (l.installCommand) lines.push(key + '_install_cmd=' + l.installCommand);
              lines.push(key + '_framework=' + l.framework);
            }

            lines.forEach(l => console.log(l));
          " >> $GITHUB_OUTPUT

      # ── Conditional Runtime Setup (only install what's needed) ──
      - name: Set up Go
        if: steps.detect.outputs.has_go == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.detect.outputs.go_version || '1.21' }}

      - name: Set up Python
        if: steps.detect.outputs.has_python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.detect.outputs.python_version || '3.10' }}

      - name: Set up Java
        if: steps.detect.outputs.has_java == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.detect.outputs.java_version || '17' }}
          distribution: 'temurin'

      # ── Conditional Dependency Installation ──
      - name: Install Python dependencies
        if: steps.detect.outputs.has_python == 'true'
        run: ${{ steps.detect.outputs.python_install_cmd || 'pip install pytest pytest-cov' }}

      - name: Install Go dependencies
        if: steps.detect.outputs.has_go == 'true'
        run: ${{ steps.detect.outputs.go_install_cmd || 'go mod download' }}

      # ── Conditional Coverage Collection ──
      - name: Run JS/TS Coverage
        if: steps.detect.outputs.has_node == 'true'
        run: |
          rm -rf coverage/
          ${{ steps.detect.outputs.typescript_test_cmd || steps.detect.outputs.javascript_test_cmd || 'npm test' }} || true

      - name: Run Go Coverage
        if: steps.detect.outputs.has_go == 'true'
        run: ${{ steps.detect.outputs.go_test_cmd || 'go test -coverprofile=coverage.out ./...' }} || true

      - name: Run Python Coverage
        if: steps.detect.outputs.has_python == 'true'
        run: |
          export PYTHONPATH="$PWD:$(find src -type d 2>/dev/null | tr '\n' ':')"
          ${{ steps.detect.outputs.python_test_cmd || 'pytest . --cov=. --cov-report=json:coverage.json' }} || true

      - name: Run Java Coverage
        if: steps.detect.outputs.has_java == 'true'
        run: ${{ steps.detect.outputs.java_test_cmd || steps.detect.outputs.kotlin_test_cmd || 'mvn clean test' }} || true

      # ── AI Test Generation ──
      - name: Generate AI Tests from Coverage
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm start -- coverage \
            --threshold ${{ env.COVERAGE_THRESHOLD }} \
            --model groq \
            --include "${{ env.INCLUDE_PATTERN }}" \
            --exclude "${{ env.EXCLUDE_PATTERN }}"

      - name: Auto-Commit AI Tests to Feature Branch
        uses: stefanzweifel/git-auto-commit-action@v5
        if: always()
        with:
          commit_message: "🤖 chore: auto-generate missing tests based on coverage"

      # ── Final Validation (rerun only detected languages) ──
      - name: Rerun Tests for Final Coverage
        if: always()
        run: |
          echo "🔄 Rerunning tests for detected languages..."
          rm -rf coverage/
          rm -f coverage.json coverage.out

          DETECTED="${{ steps.detect.outputs.languages }}"

          if echo "$DETECTED" | grep -q "typescript\|javascript"; then
            echo "▶ Running JS/TS tests..."
            ${{ steps.detect.outputs.typescript_test_cmd || steps.detect.outputs.javascript_test_cmd || 'npm test' }} || true
          fi

          if echo "$DETECTED" | grep -q "go"; then
            echo "▶ Running Go tests..."
            ${{ steps.detect.outputs.go_test_cmd || 'go test -coverprofile=coverage.out ./...' }} || true
          fi

          if echo "$DETECTED" | grep -q "python"; then
            echo "▶ Running Python tests..."
            export PYTHONPATH="$PWD:$(find src -type d 2>/dev/null | tr '\n' ':')"
            ${{ steps.detect.outputs.python_test_cmd || 'pytest . --cov=. --cov-report=json:coverage.json' }} || true
          fi

          if echo "$DETECTED" | grep -q "java\|kotlin"; then
            echo "▶ Running Java/Kotlin tests..."
            ${{ steps.detect.outputs.java_test_cmd || steps.detect.outputs.kotlin_test_cmd || 'mvn clean test' }} || true
          fi

      - name: Final Coverage Check
        run: |
          echo "🎯 Final validation against ${{ env.COVERAGE_THRESHOLD }}% threshold..."
          npm start -- coverage \
            --threshold ${{ env.COVERAGE_THRESHOLD }} \
            --exit \
            --check-only \
            --include "${{ env.INCLUDE_PATTERN }}" \
            --exclude "${{ env.EXCLUDE_PATTERN }}"

      - name: Upload Coverage Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage/
            coverage.out
            coverage.json
            target/site/jacoco/jacoco.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            dashboard/public/results.json
            coverage/

  # ============================================================
  # DASHBOARD DEPLOYMENT
  # ============================================================
  deploy-dashboard:
    name: " Deploy DevSecOps Dashboard"
    runs-on: ubuntu-latest
    needs: [generate-tests, security-normalize]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download Test Artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: .

      - name: Download Security Artifacts
        uses: actions/download-artifact@v4
        with:
          name: final-security-report
          path: dashboard/public/

      - name: Build Dashboard
        run: |
          cd dashboard
          npm install
          npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dashboard/dist
          branch: gh-pages
 